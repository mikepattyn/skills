# Template: multi-env frontend deploy
# Agent: copy into .github/workflows/, replace every __PLACEHOLDER__, strip these comments.
# Live examples: deploy-kapsalon-frontend.yml, deploy-fish-frontend.yml

name: Deploy __DISPLAY_NAME__ frontend

on:
  push:
    branches:
      - __DEFAULT_BRANCH__
    paths:
      - '__PATH_FILTER__'
      - '.github/workflows/deploy-__SLUG__-frontend.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: Development
        type: choice
        options:
          - Development
          - Staging
          - Production

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}

jobs:
  resolve-targets:
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.resolve.outputs.environments }}
    steps:
      - name: Resolve deployment environments
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENVIRONMENTS='["${{ inputs.environment }}"]'
          elif [ "${{ vars.__DEPLOY_ALL_ENVS_VAR__ }}" = "true" ]; then
            ENVIRONMENTS='["Development","Staging","Production"]'
          else
            ENVIRONMENTS='["Development"]'
          fi
          echo "environments=${ENVIRONMENTS}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve-targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.resolve-targets.outputs.environments) }}
    environment: ${{ matrix.environment }}
    steps:
      - name: __CHECKOUT_STEP_NAME__
        uses: actions/checkout@v4
        # If the job needs Authress or Mapbox: token SUBMODULE_TOKEN, submodules: true, fetch-depth 0
        # If not: omit with: entirely and name the step "Checkout"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: __LOCKFILE_PATH__

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build frontend
        env:
          DEPLOY_ENV: ${{ matrix.environment }}
        working-directory: __APP_WORKDIR__
        run: |
          __BUILD_COMMANDS__

      - name: Publish to S3 and invalidate CloudFront
        env:
          DEPLOY_ENV: ${{ matrix.environment }}
        run: |
          SOURCE="$GITHUB_WORKSPACE/__ARTIFACT_PATH__"
          PREFIX="/__SSM_APP__/${DEPLOY_ENV}/Frontend"
          BUCKET=$(aws ssm get-parameter --name "${PREFIX}/__BUCKET_PARAM__" --query 'Parameter.Value' --output text)
          DISTRIBUTION_ID=$(aws ssm get-parameter --name "${PREFIX}/DistributionId" --query 'Parameter.Value' --output text)
          echo "Syncing ${SOURCE} → s3://${BUCKET}/"
          aws s3 sync "$SOURCE" "s3://${BUCKET}/" --delete
          echo "Invalidating CloudFront distribution ${DISTRIBUTION_ID}"
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"
          echo "Done: __DISPLAY_NAME__ frontend ${DEPLOY_ENV}"

# Placeholder guide:
#   __DISPLAY_NAME__        Kapsalon
#   __SLUG__                kapsalon
#   __DEFAULT_BRANCH__      main
#   __PATH_FILTER__         apps/kapsalon/apps/web/**
#   __DEPLOY_ALL_ENVS_VAR__ DEPLOY_KAPSALON_FRONTEND_ALL_ENVS
#   __CHECKOUT_STEP_NAME__  Checkout  OR  Checkout repository and private submodules
#   __LOCKFILE_PATH__       apps/.../package-lock.json (omit cache keys if no lockfile / non-Node)
#   __APP_WORKDIR__         apps/...
#   __BUILD_COMMANDS__      npm ci && npm run build  (or Flutter / app-specific)
#   __ARTIFACT_PATH__       apps/.../dist/...
#   __SSM_APP__             Kapsalon
#   __BUCKET_PARAM__        BucketName  (Fish edge: WebBucket)
