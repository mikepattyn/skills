name: Deploy Mikepattyn backend

on:
  push:
    branches:
      - master
    paths:
      - 'apps/mikepattyn/backend/**'
      - 'packages/Mikepattyn.Email/**'
      - '.github/workflows/deploy-mikepattyn-backend.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build lambda package
        run: |
          OUTPUT="$GITHUB_WORKSPACE/infra/cdk/Mikepattyn.CDK/lambda/publish-mikepattyn"
          ZIP="$GITHUB_WORKSPACE/infra/cdk/Mikepattyn.CDK/lambda/mikepattyn.zip"
          rm -rf "$OUTPUT"
          mkdir -p "$OUTPUT" "$(dirname "$ZIP")"
          for project in \
            "$GITHUB_WORKSPACE/packages/Mikepattyn.Email/Mikepattyn.Email.csproj" \
            "$GITHUB_WORKSPACE/apps/mikepattyn/backend/Mikepattyn.Contact.Api/Mikepattyn.Contact.Api.csproj"
          do
            dotnet publish "$project" -c Release -o "$OUTPUT" /p:UseAppHost=false /p:GenerateRuntimeConfigurationFiles=true
          done
          rm -f "$ZIP"
          (cd "$OUTPUT" && zip -r "$ZIP" .)
          echo "Created $ZIP"

      - name: Update Lambda function
        run: |
          ZIP="$GITHUB_WORKSPACE/infra/cdk/Mikepattyn.CDK/lambda/mikepattyn.zip"
          FUNCTION_NAME="Mikepattyn-Contact-Api-Production"
          echo "Updating ${FUNCTION_NAME}..."
          aws lambda update-function-code \
            --function-name "${FUNCTION_NAME}" \
            --zip-file "fileb://${ZIP}"
          echo "Done: Mikepattyn backend Production"
