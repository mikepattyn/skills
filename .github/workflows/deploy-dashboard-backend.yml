name: Deploy Dashboard backend

on:
  push:
    branches:
      - master
    paths:
      - 'infra/cdk/Mikepattyn.CDK/lambda/dashboard/**'
      - '.github/workflows/deploy-dashboard-backend.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build lambda package
        run: |
          SOURCE="$GITHUB_WORKSPACE/infra/cdk/Mikepattyn.CDK/lambda/dashboard"
          ZIP="$GITHUB_WORKSPACE/infra/cdk/Mikepattyn.CDK/lambda/dashboard.zip"
          rm -f "$ZIP"
          (cd "$SOURCE" && zip -r "$ZIP" .)
          echo "Created $ZIP"

      - name: Update Lambda function
        run: |
          ZIP="$GITHUB_WORKSPACE/infra/cdk/Mikepattyn.CDK/lambda/dashboard.zip"
          FUNCTION_NAME="Dashboard-Backend-Stack-StatsFunction-Production"
          echo "Updating ${FUNCTION_NAME}..."
          aws lambda update-function-code \
            --function-name "${FUNCTION_NAME}" \
            --zip-file "fileb://${ZIP}"
          echo "Done: Dashboard backend Production"
