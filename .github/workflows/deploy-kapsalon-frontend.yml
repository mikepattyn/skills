name: Deploy Kapsalon frontend

on:
  push:
    branches:
      - master
    paths:
      - 'apps/kapsalon/apps/web/**'
      - '.github/workflows/deploy-kapsalon-frontend.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: Development
        type: choice
        options:
          - Development
          - Staging
          - Production
  workflow_call:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}

jobs:
  resolve-targets:
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.resolve.outputs.environments }}
    steps:
      - name: Resolve deployment environments
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "workflow_call" ]; then
            ENVIRONMENTS='["${{ inputs.environment }}"]'
          elif [ "${{ vars.DEPLOY_KAPSALON_FRONTEND_ALL_ENVS }}" = "true" ]; then
            ENVIRONMENTS='["Development","Staging","Production"]'
          else
            ENVIRONMENTS='["Development","Production"]'
          fi
          echo "environments=${ENVIRONMENTS}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve-targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.resolve-targets.outputs.environments) }}
    environment: ${{ matrix.environment }}
    defaults:
      run:
        working-directory: apps/kapsalon/apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: apps/kapsalon/apps/web/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build frontend
        env:
          DEPLOY_ENV: ${{ matrix.environment }}
        run: |
          BUILD_CONFIGURATION=$(echo "$DEPLOY_ENV" | tr '[:upper:]' '[:lower:]')
          npm ci
          npm run test:ci
          sed -e "s|__TENANT_ID__|sabunandsteel|g" \
              -e "s|__ENABLE_DEMO_SHORTCUTS__|false|g" \
            src/environments/environment.template.ts \
            > "src/environments/environment.${BUILD_CONFIGURATION}.ts"
          npm run build -- --configuration "$BUILD_CONFIGURATION"

      - name: Publish to S3 and invalidate CloudFront
        env:
          DEPLOY_ENV: ${{ matrix.environment }}
        run: |
          SOURCE="$GITHUB_WORKSPACE/apps/kapsalon/apps/web/dist/web/browser"
          PREFIX="/Kapsalon/${DEPLOY_ENV}/Frontend"
          BUCKET=$(aws ssm get-parameter --name "${PREFIX}/BucketName" --query 'Parameter.Value' --output text)
          DISTRIBUTION_ID=$(aws ssm get-parameter --name "${PREFIX}/DistributionId" --query 'Parameter.Value' --output text)
          echo "Syncing ${SOURCE} → s3://${BUCKET}/"
          aws s3 sync "$SOURCE" "s3://${BUCKET}/" --delete
          echo "Invalidating CloudFront distribution ${DISTRIBUTION_ID}"
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"
