name: Deploy Theming content

on:
  push:
    branches:
      - master
    paths:
      - 'apps/theming/**'
      - 'packages/themes/**'
      - 'apps/package.json'
      - 'apps/package-lock.json'
      - 'apps/angular.json'
      - 'apps/tsconfig.json'
      - '.github/workflows/deploy-theming-content.yml'
  workflow_dispatch:
    inputs:
      artifact:
        description: 'angular (default) or legacy source-tree rollback'
        required: false
        default: angular
        type: choice
        options:
          - angular
          - legacy

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  ARTIFACT: ${{ github.event.inputs.artifact || 'angular' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node 24 LTS
        if: env.ARTIFACT == 'angular'
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: apps/package-lock.json

      - name: Unit test Angular Theming
        if: env.ARTIFACT == 'angular'
        working-directory: apps
        env:
          NODE_OPTIONS: --localstorage-file=${{ runner.temp }}/node-localstorage
        run: |
          npm ci
          npm run test:theming

      - name: Build Angular Theming
        if: env.ARTIFACT == 'angular'
        working-directory: apps
        run: |
          npm run build:theming
          node scripts/write-artifact-manifest.mjs dist/theming/browser "$GITHUB_SHA"

      - name: Upload SHA artifact
        if: env.ARTIFACT == 'angular'
        uses: actions/upload-artifact@v4
        with:
          name: theming-${{ github.sha }}
          path: apps/dist/theming/browser
          retention-days: 30

      - name: Publish Angular output
        if: env.ARTIFACT == 'angular'
        run: bash scripts/sync-angular-frontend.sh Theming Production "$GITHUB_WORKSPACE/apps/dist/theming/browser"

      - name: Vendor Theme Package CSS
        if: env.ARTIFACT == 'legacy'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apps/theming/css"
          cp "$GITHUB_WORKSPACE/packages/themes/"*.css "$GITHUB_WORKSPACE/apps/theming/css/"

      - name: Publish legacy source
        if: env.ARTIFACT == 'legacy'
        run: |
          SOURCE="$GITHUB_WORKSPACE/apps/theming"
          PREFIX="/Theming/Production/Frontend"
          BUCKET=$(aws ssm get-parameter --name "${PREFIX}/BucketName" --query 'Parameter.Value' --output text)
          DISTRIBUTION_ID=$(aws ssm get-parameter --name "${PREFIX}/DistributionId" --query 'Parameter.Value' --output text)
          aws s3 sync "$SOURCE" "s3://${BUCKET}/" --delete \
            --exclude ".git/*" \
            --exclude ".cursor/*" \
            --exclude "src/*" \
            --exclude "tsconfig*.json"
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
